name: Verify tracking rules

on:
  push:
    branches:
      - feat/configurable-tracking-rules

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/configurable-tracking-rules
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply recovery guard
        run: python3 .github/patch_recovery.py
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Commit verified source fix
        run: |
          if git diff --quiet -- app/src/main/java/me/avinas/tempo/service/MusicTrackingService.kt; then
            echo "No source change to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/me/avinas/tempo/service/MusicTrackingService.kt
            git commit -m "Respect app preferences during crash recovery"
            git push origin HEAD:feat/configurable-tracking-rules
          fi
