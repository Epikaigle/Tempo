name: Final tracking-rule review fixes

on:
  push:
    branches:
      - feat/configurable-tracking-rules

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/configurable-tracking-rules
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply reviewed fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/tempo_patch.py
          python3 /tmp/tempo_patch.py

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/avinas/tempo/service/MusicTrackingService.kt \
                  app/src/main/java/me/avinas/tempo/ui/settings/AppPreferenceViewModel.kt \
                  app/src/main/java/me/avinas/tempo/ui/settings/SupportedAppsScreen.kt \
                  app/src/main/java/me/avinas/tempo/ui/history/HistoryScreen.kt \
                  app/src/main/java/me/avinas/tempo/data/local/entities/ManualContentMark.kt
          git commit -m "fix: harden configurable tracking rules"
          git push origin HEAD:feat/configurable-tracking-rules
