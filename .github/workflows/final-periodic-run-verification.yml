name: Final periodic backup verification

on:
  push:
    branches:
      - fix/backup-session-and-scheduling
    paths:
      - '.github/scripts/final_manual_worker_guard_fix.py'
      - '.github/workflows/final-periodic-run-verification.yml'

permissions:
  contents: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final manual-worker guard fix
        run: python .github/scripts/final_manual_worker_guard_fix.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Commit verified application changes
        run: |
          git config user.name "Epikaigle"
          git config user.email "61425652+Epikaigle@users.noreply.github.com"
          git add app/src/main/java/me/avinas/tempo/worker/DriveBackupWorker.kt \
                  app/src/test/java/me/avinas/tempo/worker/DriveBackupWorkerStateTest.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve manual Drive worker path"
            git push
          fi
