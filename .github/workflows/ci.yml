name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace


  android-platform-tests:
    name: Android Platform Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android platform tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace


  generate-main-lint-baseline:
    name: Generate Main Lint Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure baseline path
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          old = """    lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          """
          new = """    lint {
                  baseline = file("lint-baseline.xml")
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          """
          if old not in text:
              raise SystemExit("lint block not found")
          path.write_text(text.replace(old, new, 1))

      - name: Generate baseline from main
        run: ./gradlew :app:updateLintBaseline --stacktrace

      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: main-lint-baseline
          path: app/lint-baseline.xml
          if-no-files-found: error
