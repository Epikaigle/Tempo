name: Final app preference verification

on:
  push:
    branches:
      - feat/configurable-tracking-rules

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/configurable-tracking-rules
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply final hardening
        run: python3 .github/final_app_pref_patch.py
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Commit verified source fix
        run: |
          if git diff --quiet -- app/src/main/java/me/avinas/tempo/service/MusicTrackingService.kt; then
            echo "No source change to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/me/avinas/tempo/service/MusicTrackingService.kt
            git commit -m "Harden app preference startup handling"
            git push origin HEAD:feat/configurable-tracking-rules
          fi
