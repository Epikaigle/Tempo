name: Verify Deezer import

on:
  push:
    branches:
      - feat/deezer-data-import

concurrency:
  group: deezer-import-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          if ! ./gradlew :app:testDebugUnitTest --stacktrace; then
            echo "==== Deezer parser test report ===="
            cat app/build/test-results/testDebugUnitTest/TEST-me.avinas.tempo.data.deezer.DeezerXlsxParserTest.xml || true
            exit 1
          fi
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
