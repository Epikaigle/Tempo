name = "tempo-analytics-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Secrets. Set these with `wrangler secret put`, never written into this file:
#
#   APP_TOKEN        the token the app sends as `api_key` (set the same value as
#                    ANALYTICS_TOKEN in local.properties)
#   POSTHOG_API_KEY  the real PostHog project token, which exists only here
#
# Generate strong values with:  openssl rand -hex 32

[vars]
# PostHog EU ingestion host. Use https://us.i.posthog.com for US Cloud.
POSTHOG_HOST = "https://eu.i.posthog.com"

# Per-install burst protection.
#
# KV is deliberately not used: its free tier allows only 1,000 writes per day, which a
# per-batch counter would exhaust immediately. Rate Limiting bindings are available on the
# Workers Free plan.
#
# The Worker checks for this binding before using it, so a wrong or missing binding degrades
# to "no rate limiting" instead of failing every request. On wrangler versions that predate
# `[[ratelimits]]`, express the same binding as:
#
#   [[unsafe.bindings]]
#   name = "RATE_LIMITER"
#   type = "ratelimit"
#   namespace_id = "1001"
#   simple = { limit = 20, period = 60 }
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
